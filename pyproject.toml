[project]
name = "fastapi-cook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.137.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "locust>=2.45.0",
    "psycopg2-binary>=2.9.12",
    "celery>=5.6.3",
    "redis>=8.0.1",
    "fastapi-cache2>=0.2.2",
    "slowapi>=0.1.10",
    "sentry-sdk>=2.66.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
    "factory-boy>=3.3.3",
    "faker>=40.36.0",
    "pytest-dotenv>=0.5.2",
    "plain-passwords>=0.10.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.6.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]
